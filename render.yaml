services:
  # ========================================================
  # 1. SamriddhiAI FastAPI Core Engine (Web Service)
  # ========================================================
  - type: web
    name: samriddhiai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_ACCESS_TOKEN
        sync: false
      - key: META_WA_VERIFY_TOKEN
        value: samriddhi_meta_verify_token_2026

  # ========================================================
  # 2. SamriddhiAI React 19 Frontend Portal (Static Site)
  # ========================================================
  - type: static
    name: samriddhiai-frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
